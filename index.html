<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>頭痛日記</title>
<style>
    :root { --bg-color: #121212; --surface-color: #1e1e1e; --text-color: #e0e0e0; --primary-color: #4f8bc9; --border-color: #333; --danger-color: #cf6679; --timeline-color: #4f8bc988; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; padding-bottom: 80px; }
    * { box-sizing: border-box; }
    h2, h3 { color: #fff; margin-top: 0; }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; }
    
    .nav { display: flex; position: fixed; bottom: 0; width: 100%; background: var(--surface-color); border-top: 1px solid var(--border-color); z-index: 100; }
    .nav button { flex: 1; padding: 15px 5px; background: none; border: none; color: var(--text-color); font-size: 15px; cursor: pointer; }
    .nav button.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section { background: var(--surface-color); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px;}
    input[type="datetime-local"], input[type="text"], textarea { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; font-size: 16px; }
    textarea { resize: vertical; min-height: 80px; }
    
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn-check { padding: 12px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 15px; cursor: pointer; user-select: none; flex-grow: 1; text-align: center; }
    .pain-scale { display: flex; flex-direction: column; gap: 8px; }
    .pain-scale .btn-check { text-align: left; }
    input[type="checkbox"], input[type="radio"] { display: none; }
    input[type="checkbox"]:checked + .btn-check, input[type="radio"]:checked + .btn-check { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

    .matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .matrix-header { text-align: center; font-weight: bold; color: #888; }
    
    .save-btn { width: 100%; padding: 15px; background: var(--primary-color); color: #fff; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; margin-top: 10px; }
    .action-btn { background: #444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 5px;}
    
    .record-card { background: var(--surface-color); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
    .record-time { font-weight: bold; color: var(--primary-color); font-size: 18px; margin-bottom: 5px;}
    .record-detail { font-size: 14px; margin-bottom: 4px; color: #ddd;}
    .timeline { margin-top: 10px; padding-left: 15px; border-left: 2px dashed var(--timeline-color); }
    .timeline-item { margin-bottom: 10px; position: relative; }
    .timeline-item::before { content: ''; position: absolute; left: -21px; top: 5px; width: 10px; height: 10px; background: var(--primary-color); border-radius: 50%; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; }
    .modal-content { background: var(--surface-color); width: 90%; max-width: 400px; padding: 20px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
    
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 18px; font-weight: bold; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
    .cal-day-name { font-weight: bold; color: #888; margin-bottom: 5px; }
    .cal-cell { height: 45px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-color); border-radius: 6px; border: 1px solid var(--border-color); font-size: 14px; position: relative; }
    .cal-dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 2px; }
    
    .pain-1 { background-color: #556b2f; }
    .pain-2 { background-color: #b8860b; }
    .pain-3 { background-color: #cd5c5c; }
    .pain-4 { background-color: #8b0000; }
    .pain-5 { background-color: #800080; }
</style>
</head>
<body>

<div class="container">
    <div id="tab-record" class="tab-content active">
        <h2 id="form-title">新增紀錄</h2>
        <div class="section">
            <div class="section-title">發作時間</div>
            <input type="datetime-local" id="record-time">
        </div>
        <div class="section">
            <div class="section-title">痛覺評分</div>
            <div class="pain-scale" id="pain-group">
                <label><input type="radio" name="pain" value="1:有感"><div class="btn-check">1分：有感</div></label>
                <label><input type="radio" name="pain" value="2:微痛"><div class="btn-check">2分：微痛</div></label>
                <label><input type="radio" name="pain" value="3:該吃藥"><div class="btn-check">3分：該吃藥了</div></label>
                <label><input type="radio" name="pain" value="4:反胃難眠"><div class="btn-check">4分：痛到反胃或睡不著</div></label>
                <label><input type="radio" name="pain" value="5:爆痛藥無效"><div class="btn-check">5分：痛到爆，藥無效</div></label>
            </div>
        </div>
        <div class="section">
            <div class="section-title">頭痛部位 (可多選)</div>
            <div class="matrix">
                <div class="matrix-header">左側</div><div class="matrix-header">右側</div>
                <label><input type="checkbox" value="左前額" class="loc-check"><div class="btn-check">前額</div></label>
                <label><input type="checkbox" value="右前額" class="loc-check"><div class="btn-check">前額</div></label>
                <label><input type="checkbox" value="左眼眶" class="loc-check"><div class="btn-check">眼眶</div></label>
                <label><input type="checkbox" value="右眼眶" class="loc-check"><div class="btn-check">眼眶</div></label>
                <label><input type="checkbox" value="左太陽穴" class="loc-check"><div class="btn-check">太陽穴</div></label>
                <label><input type="checkbox" value="右太陽穴" class="loc-check"><div class="btn-check">太陽穴</div></label>
                <label><input type="checkbox" value="左側腦" class="loc-check"><div class="btn-check">側腦</div></label>
                <label><input type="checkbox" value="右側腦" class="loc-check"><div class="btn-check">側腦</div></label>
                <label><input type="checkbox" value="左後上方" class="loc-check"><div class="btn-check">後上方</div></label>
                <label><input type="checkbox" value="右後上方" class="loc-check"><div class="btn-check">後上方</div></label>
                <label><input type="checkbox" value="左後下方" class="loc-check"><div class="btn-check">後下方</div></label>
                <label><input type="checkbox" value="右後下方" class="loc-check"><div class="btn-check">後下方</div></label>
            </div>
            <div class="btn-group" style="margin-top:10px;">
                <label><input type="checkbox" value="深部/腦內" class="loc-check"><div class="btn-check">深部/腦內</div></label>
            </div>
        </div>
        <div class="section">
            <div class="section-title">持續時間 (可事後補填)</div>
            <div class="btn-group">
                <label><input type="radio" name="duration" value="1小時內"><div class="btn-check">1小時內</div></label>
                <label><input type="radio" name="duration" value="1~3小時"><div class="btn-check">1~3小時</div></label>
                <label><input type="radio" name="duration" value="半天"><div class="btn-check">半天</div></label>
                <label><input type="radio" name="duration" value="整天"><div class="btn-check">整天</div></label>
                <label><input type="radio" name="duration" value="超過一天"><div class="btn-check">超過一天</div></label>
            </div>
        </div>
        <div class="section">
            <div class="section-title">誘因 (可多選)</div>
            <div class="btn-group">
                <label><input type="checkbox" value="吹到風" class="trigger-check"><div class="btn-check">吹到風</div></label>
                <label><input type="checkbox" value="冷氣變冷" class="trigger-check"><div class="btn-check">冷氣變冷</div></label>
                <label><input type="checkbox" value="睡眠不足" class="trigger-check"><div class="btn-check">睡眠不足</div></label>
                <label><input type="checkbox" value="壓力" class="trigger-check"><div class="btn-check">壓力</div></label>
                <label><input type="checkbox" value="生理期" class="trigger-check"><div class="btn-check">生理期</div></label>
            </div>
            <input type="text" id="custom-trigger" placeholder="自訂誘因..." style="margin-top:10px;">
        </div>
        <div class="section">
            <div class="section-title">用藥與效果</div>
            <div class="btn-group">
                <label><input type="checkbox" value="普拿疼" class="med-check"><div class="btn-check">普拿疼</div></label>
                <label><input type="checkbox" value="布洛芬(消炎止痛)" class="med-check"><div class="btn-check">布洛芬</div></label>
            </div>
            <div class="btn-group" style="margin-top:10px;">
                <label><input type="radio" name="effect" value="無效"><div class="btn-check">無效</div></label>
                <label><input type="radio" name="effect" value="稍微緩解"><div class="btn-check">稍微緩解</div></label>
                <label><input type="radio" name="effect" value="完全壓制"><div class="btn-check">完全壓制</div></label>
            </div>
        </div>
        <div class="section">
            <div class="section-title">備註</div>
            <textarea id="memo" placeholder="其他細節..."></textarea>
        </div>
        <input type="hidden" id="edit-id" value="">
        <button class="save-btn" onclick="saveRecord()" id="save-btn-text">儲存紀錄</button>
        <button class="save-btn" style="background:#555; display:none;" id="cancel-edit-btn" onclick="cancelEdit()">取消編輯</button>
    </div>

    <div id="tab-history" class="tab-content">
        <h2>歷史紀錄</h2>
        <div id="records-list"></div>
    </div>

    <div id="tab-calendar" class="tab-content">
        <h2>發作月曆</h2>
        <div class="section">
            <div class="calendar-header">
                <button class="action-btn" onclick="changeMonth(-1)">◀ 上個月</button>
                <span id="cal-month-year">...</span>
                <button class="action-btn" onclick="changeMonth(1)">下個月 ▶</button>
            </div>
            <div class="calendar-grid" id="cal-grid"></div>
            <div style="margin-top:15px; font-size:13px; color:#aaa; display:flex; gap:10px; justify-content:center;">
                <div><span class="cal-dot pain-1" style="display:inline-block"></span> 1分</div>
                <div><span class="cal-dot pain-3" style="display:inline-block"></span> 3分</div>
                <div><span class="cal-dot pain-5" style="display:inline-block"></span> 5分</div>
            </div>
        </div>
    </div>
</div>

<div class="nav">
    <button id="nav-record" class="active" onclick="switchTab('record')">新增/編輯</button>
    <button id="nav-history" onclick="switchTab('history')">歷史紀錄</button>
    <button id="nav-calendar" onclick="switchTab('calendar')">📅 月曆</button>
</div>

<div class="modal-overlay" id="change-modal">
    <div class="modal-content">
        <h3 style="margin-bottom:15px;">➕ 紀錄頭痛轉移</h3>
        <input type="hidden" id="change-parent-id">
        <label>變化時間：</label>
        <input type="datetime-local" id="change-time" style="margin-bottom:15px;">
        
        <label>變化後痛覺：</label>
        <div class="pain-scale" style="margin-bottom:15px;">
            <label><input type="radio" name="change-pain" value="1:有感"><div class="btn-check">1分</div></label>
            <label><input type="radio" name="change-pain" value="3:該吃藥"><div class="btn-check">3分</div></label>
            <label><input type="radio" name="change-pain" value="5:爆痛藥無效"><div class="btn-check">5分</div></label>
        </div>

        <label>轉移到哪個部位：</label>
        <input type="text" id="change-locs" placeholder="例如：右太陽穴" style="margin-bottom:15px;">
        
        <label>狀況備註：</label>
        <input type="text" id="change-memo" placeholder="例如：冷氣變冷、開始反胃..." style="margin-bottom:15px;">
        
        <button class="save-btn" onclick="saveChange()">儲存變化</button>
        <button class="save-btn" style="background:#555;" onclick="closeModal()">取消</button>
    </div>
</div>

<script>
    var currentCalDate = new Date();

    function setNow(elementId) {
        try {
            var now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            var el = document.getElementById(elementId);
            if(el) el.value = now.toISOString().slice(0,16);
        } catch(e) { console.log(e); }
    }

    window.onload = function() {
        setNow('record-time');
    };

    function getRecords() {
        var data = localStorage.getItem('headache_records');
        return data ? JSON.parse(data) : [];
    }

    function getRadioVal(name) {
        var el = document.querySelector('input[name="' + name + '"]:checked');
        return el ? el.value : '';
    }

    function saveRecord() {
        var id = document.getElementById('edit-id').value;
        var time = document.getElementById('record-time').value;
        var pain = getRadioVal('pain') || '未填寫';
        var duration = getRadioVal('duration') || '未確認';
        
        var locs = [];
        document.querySelectorAll('.loc-check:checked').forEach(function(el){ locs.push(el.value); });
        
        var triggers = [];
        document.querySelectorAll('.trigger-check:checked').forEach(function(el){ triggers.push(el.value); });
        var customTrigger = document.getElementById('custom-trigger').value.trim();
        if(customTrigger) triggers.push(customTrigger);
        
        var meds = [];
        document.querySelectorAll('.med-check:checked').forEach(function(el){ meds.push(el.value); });
        
        var effect = getRadioVal('effect');
        var memo = document.getElementById('memo').value.trim();

        if(!time) return alert("請填寫時間！");

        var records = getRecords();
        if(id) {
            var index = records.findIndex(function(r){ return r.id == id; });
            if(index > -1) {
                records[index].time = time;
                records[index].pain = pain;
                records[index].duration = duration;
                records[index].locs = locs.join('、');
                records[index].triggers = triggers.join('、');
                records[index].meds = meds.join('、');
                records[index].effect = effect;
                records[index].memo = memo;
            }
            alert("編輯已儲存！");
        } else {
            records.push({ id: Date.now(), time: time, pain: pain, duration: duration, locs: locs.join('、'), triggers: triggers.join('、'), meds: meds.join('、'), effect: effect, memo: memo, changes: [] });
            alert("紀錄已儲存！");
        }

        records.sort(function(a, b){ return new Date(b.time) - new Date(a.time); });
        localStorage.setItem('headache_records', JSON.stringify(records));
        
        cancelEdit();
        switchTab('history');
    }

    function editRecord(id) {
        var record = getRecords().find(function(r){ return r.id == id; });
        if(!record) return;
        
        document.getElementById('edit-id').value = record.id;
        document.getElementById('record-time').value = record.time;
        document.getElementById('memo').value = record.memo || '';
        document.getElementById('custom-trigger').value = '';
        
        document.querySelectorAll('input[type="radio"], input[type="checkbox"]').forEach(function(el){ el.checked = false; });
        
        if(record.pain) { var p = document.querySelector('input[name="pain"][value="' + record.pain + '"]'); if(p) p.checked = true; }
        if(record.duration) { var d = document.querySelector('input[name="duration"][value="' + record.duration + '"]'); if(d) d.checked = true; }
        if(record.effect) { var e = document.querySelector('input[name="effect"][value="' + record.effect + '"]'); if(e) e.checked = true; }
        
        if(record.locs) record.locs.split('、').forEach(function(v){ var cb = document.querySelector('.loc-check[value="' + v + '"]'); if(cb) cb.checked = true; });
        if(record.triggers) record.triggers.split('、').forEach(function(v){ var cb = document.querySelector('.trigger-check[value="' + v + '"]'); if(cb) cb.checked = true; });
        if(record.meds) record.meds.split('、').forEach(function(v){ var cb = document.querySelector('.med-check[value="' + v + '"]'); if(cb) cb.checked = true; });
        
        document.getElementById('form-title').innerText = "編輯紀錄";
        document.getElementById('save-btn-text').innerText = "儲存編輯";
        document.getElementById('cancel-edit-btn').style.display = 'block';
        switchTab('record');
    }

    function cancelEdit() {
        document.getElementById('edit-id').value = '';
        document.getElementById('form-title').innerText = "新增紀錄";
        document.getElementById('save-btn-text').innerText = "儲存紀錄";
        document.getElementById('cancel-edit-btn').style.display = 'none';
        document.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(function(el){ el.checked = false; });
        document.querySelectorAll('input[type="text"], textarea').forEach(function(el){ el.value = ''; });
        setNow('record-time');
    }

    function openChangeModal(id) {
        document.getElementById('change-parent-id').value = id;
        setNow('change-time');
        document.getElementById('change-locs').value = '';
        document.getElementById('change-memo').value = '';
        document.querySelectorAll('input[name="change-pain"]').forEach(function(el){ el.checked = false; });
        document.getElementById('change-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('change-modal').style.display = 'none'; }

    function saveChange() {
        var id = document.getElementById('change-parent-id').value;
        var time = document.getElementById('change-time').value;
        var pain = getRadioVal('change-pain') || '未填寫';
        var locs = document.getElementById('change-locs').value.trim();
        var memo = document.getElementById('change-memo').value.trim();

        if(!time) return alert("請輸入時間");

        var records = getRecords();
        var index = records.findIndex(function(r){ return r.id == id; });
        if(index > -1) {
            if(!records[index].changes) records[index].changes = [];
            records[index].changes.push({ time: time, pain: pain, locs: locs, memo: memo });
            records[index].changes.sort(function(a,b){ return new Date(a.time) - new Date(b.time); });
            localStorage.setItem('headache_records', JSON.stringify(records));
        }
        closeModal();
        renderHistory();
    }

    function deleteRecord(id) {
        if(confirm("確定刪除此紀錄？")) {
            var records = getRecords().filter(function(r){ return r.id != id; });
            localStorage.setItem('headache_records', JSON.stringify(records));
            renderHistory();
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-content, .nav button').forEach(function(el){ el.classList.remove('active'); });
        var tabEl = document.getElementById('tab-' + tab);
        var navEl = document.getElementById('nav-' + tab);
        if(tabEl) tabEl.classList.add('active');
        if(navEl) navEl.classList.add('active');
        
        if(tab === 'history') renderHistory();
        if(tab === 'calendar') renderCalendar();
    }

    function renderHistory() {
        var records = getRecords();
        var listDiv = document.getElementById('records-list');
        if(records.length === 0) { listDiv.innerHTML = "<p>尚無紀錄。</p>"; return; }

        var html = '';
        records.forEach(function(r){
            var dateStr = r.time.replace('T', ' ');
            var changesHtml = '';
            if(r.changes && r.changes.length > 0) {
                changesHtml = '<div class="timeline">';
                r.changes.forEach(function(c){
                    var cTime = c.time.split('T')[1] || c.time;
                    changesHtml += '<div class="timeline-item"><div style="font-size:13px; color:#aaa;">' + cTime + ' 轉移/變化：</div>';
                    changesHtml += '<div>' + c.pain.split(':')[0] + '分 | ' + (c.locs || '無填寫部位') + '</div>';
                    if(c.memo) changesHtml += '<div style="color:#bbb; font-size:13px;">↳ 備註：' + c.memo + '</div>';
                    changesHtml += '</div>';
                });
                changesHtml += '</div>';
            }

            html += '<div class="record-card">';
            html += '<div class="record-time">' + dateStr + ' | ' + r.pain.split(':')[0] + '分</div>';
            html += '<div class="record-detail"><strong>持續時間：</strong>' + (r.duration || '未填寫') + '</div>';
            html += '<div class="record-detail"><strong>部位：</strong>' + (r.locs || '無') + '</div>';
            html += '<div class="record-detail"><strong>誘因：</strong>' + (r.triggers || '無') + '</div>';
            html += '<div class="record-detail"><strong>用藥：</strong>' + (r.meds || '無') + (r.effect ? ' ('+r.effect+')' : '') + '</div>';
            if(r.memo) html += '<div class="record-detail"><strong>備註：</strong>' + r.memo + '</div>';
            html += changesHtml;
            html += '<div style="margin-top:15px; display:flex; gap:10px;">';
            html += '<button class="action-btn" onclick="openChangeModal(' + r.id + ')">➕ 紀錄變化</button>';
            html += '<button class="action-btn" onclick="editRecord(' + r.id + ')">✏️ 編輯</button>';
            html += '<button class="action-btn" style="background:var(--danger-color);" onclick="deleteRecord(' + r.id + ')">刪除</button>';
            html += '</div></div>';
        });
        listDiv.innerHTML = html;
    }

    function changeMonth(offset) {
        currentCalDate.setMonth(currentCalDate.getMonth() + offset);
        renderCalendar();
    }

    function renderCalendar() {
        var grid = document.getElementById('cal-grid');
        var monthYear = document.getElementById('cal-month-year');
        var year = currentCalDate.getFullYear();
        var month = currentCalDate.getMonth();
        
        monthYear.innerText = year + ' 年 ' + (month + 1) + ' 月';
        
        var html = '';
        var days = ['日','一','二','三','四','五','六'];
        for(var d=0; d<7; d++) html += '<div class="cal-day-name">' + days[d] + '</div>';
        
        var firstDay = new Date(year, month, 1).getDay();
        var daysInMonth = new Date(year, month + 1, 0).getDate();
        for(var i=0; i<firstDay; i++) html += '<div></div>';
        
        var records = getRecords();
        var dayPains = {};
        records.forEach(function(r){
            var d = new Date(r.time);
            if(d.getFullYear() === year && d.getMonth() === month) {
                var dateKey = d.getDate();
                var p = parseInt(r.pain.charAt(0)) || 1;
                if(r.changes) { r.changes.forEach(function(c){ var cp = parseInt(c.pain.charAt(0))||1; if(cp>p) p=cp; }); }
                if(!dayPains[dateKey] || p > dayPains[dateKey]) dayPains[dateKey] = p;
            }
        });

        for(var i=1; i<=daysInMonth; i++) {
            var dot = dayPains[i] ? '<div class="cal-dot pain-' + dayPains[i] + '"></div>' : '';
            html += '<div class="cal-cell">' + i + dot + '</div>';
        }
        grid.innerHTML = html;
    }
</script>
</body>
</html>
